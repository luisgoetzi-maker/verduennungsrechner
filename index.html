  <script>
    // Farbschema vor dem ersten Zeichnen setzen (kein weißes Aufblitzen)
    try {
      var s = JSON.parse(localStorage.getItem('vr.settings') || '{}');
      var t = s.theme || 'dark';
      if (t === 'system') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) { /* Standard: dunkel */ }
  </script>

<body>
  <header class="topbar">
    <img class="logo" src="icons/icon.svg" alt="" width="28" height="28">
    <h1>Verdünnungsrechner</h1>
    <span id="net" class="badge">offline-fähig</span>
  </header>
  <main id="view">
    <!-- Wird beim Start der App ersetzt. Bleibt es stehen, konnte JavaScript nicht geladen werden. -->
    <section class="card" id="boot-msg" style="margin-top:16px">
      <h2>App wird geladen …</h2>
      <p id="boot-hint" class="small muted"></p>
    </section>
  </main>
  <nav class="bottomnav" id="nav" aria-label="Hauptnavigation"></nav>
  <noscript><p style="padding:16px">Bitte JavaScript aktivieren.</p></noscript>
  <script>
    (function () {
      var hint = document.getElementById('boot-hint');
      if (!hint) return;
      setTimeout(function () {
        if (document.getElementById('boot-msg')) {
          hint.textContent = 'Die App startet nicht. Bitte die Seite neu laden (Strg + F5). Hilft das nicht: start.bat verwenden oder Website-Daten (Cache) für diese Adresse löschen.';
        }
      }, 5000);
    })();
  </script>
</body>
